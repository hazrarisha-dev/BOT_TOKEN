services:
  - type: worker
    name: main-2-telegram-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python Main-2.py
    disk:
      name: bot-database
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_CONTACT
        value: "@Kirampur"
      - key: BOT_USERNAME
        value: ""
      - key: DATABASE_PATH
        value: /var/data/Galu.db
      - key: FAMGATEWAY_API_KEY
        sync: false
      - key: WELCOME_STICKER_ID
        value: ""
      - key: SUPPORT_TELEGRAM_URL
        value: https://t.me/Kirampur
      - key: SUPPORT_WHATSAPP_URL
        value: ""
      - key: LOG_LEVEL
        value: INFO
        
